<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Beirut Wine Training</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #2c1810 0%, #1a0f0a 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 900px; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 40px; padding-top: 20px; }
        .header h1 { font-size: 32px; font-weight: 600; margin-bottom: 8px; letter-spacing: -0.5px; }
        .header p { font-size: 14px; color: #d4af9a; font-weight: 500; }

        .profile-section {
            display: flex; align-items: center; justify-content: center;
            gap: 12px; margin-bottom: 16px;
        }
        .profile-select {
            padding: 8px 12px;
            background: rgba(139,111,71,0.3);
            border: 1px solid #8b6f47;
            color: #d4af9a; border-radius: 6px; font-size: 14px; cursor: pointer;
        }
        .profile-select:hover { background: rgba(139,111,71,0.5); }
        .profile-select option { background: #3d2f23; color: #d4af9a; }

        .mode-tabs {
            display: flex; gap: 12px; justify-content: center; margin-bottom: 24px;
            border-bottom: 1px solid rgba(139,111,71,0.3); padding-bottom: 16px;
        }
        .mode-tab {
            padding: 10px 20px; background: transparent; border: none;
            color: #8b6f47; font-size: 14px; font-weight: 500; cursor: pointer;
            border-bottom: 2px solid transparent; transition: all 0.2s;
        }
        .mode-tab.active { color: #d4af9a; border-bottom-color: #d4af9a; }
        .mode-tab:hover { color: #d4af9a; }

        .controls { display: grid; gap: 16px; margin-bottom: 32px; }
        .filter-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        .filter-btn {
            padding: 8px 16px; border: 1px solid #8b6f47;
            background: rgba(139,111,71,0.2); color: #d4af9a; border-radius: 6px;
            cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s;
        }
        .filter-btn:hover { background: rgba(139,111,71,0.4); border-color: #d4af9a; }
        .filter-btn.active { background: #8b6f47; border-color: #d4af9a; color: #fff; }

        .progress-bar {
            height: 3px; background: rgba(212,175,154,0.1);
            border-radius: 2px; overflow: hidden; margin-bottom: 24px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #d4af9a 0%, #c9956f 100%);
            transition: width 0.3s;
        }

        .keyboard-hint {
            text-align: center; font-size: 11px; color: #6b5040; margin-top: 8px;
            letter-spacing: 0.5px;
        }
        .keyboard-hint kbd {
            display: inline-block; padding: 2px 6px; background: rgba(139,111,71,0.2);
            border: 1px solid #5a3e2b; border-radius: 3px; font-size: 10px;
            color: #a07848; font-family: inherit; margin: 0 2px;
        }

        /* Flashcard */
        .card-container { perspective: 1000px; margin-bottom: 16px; }
        .card {
            width: 100%; height: 360px; cursor: pointer; position: relative;
            transform-style: preserve-3d; transition: transform 0.6s;
        }
        .card.flipped { transform: rotateY(180deg); }
        .card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; display: flex; flex-direction: column;
            justify-content: center; padding: 40px; border-radius: 12px;
            border: 2px solid #8b6f47;
        }
        .card-front { background: linear-gradient(135deg, #4a3728 0%, #3d2f23 100%); }
        .card-back {
            background: linear-gradient(135deg, #3d2f23 0%, #2c1810 100%);
            transform: rotateY(180deg);
        }
        .card-category { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; color: #d4af9a; text-transform: uppercase; margin-bottom: 12px; opacity: 0.8; }
        .card-title { font-size: 28px; font-weight: 600; margin-bottom: 8px; line-height: 1.2; }
        .card-producer { font-size: 16px; color: #b89968; margin-bottom: 16px; font-weight: 500; }
        .card-meta { display: flex; gap: 24px; margin-top: 24px; font-size: 13px; color: #b89968; }
        .meta-item { display: flex; flex-direction: column; }
        .meta-label { font-size: 11px; letter-spacing: 0.5px; color: #8b6f47; text-transform: uppercase; margin-bottom: 4px; }
        .meta-value { font-weight: 600; color: #d4af9a; font-size: 14px; }
        .card-section { margin-bottom: 16px; }
        .section-label { font-size: 11px; letter-spacing: 1px; color: #8b6f47; text-transform: uppercase; margin-bottom: 8px; font-weight: 600; }
        .section-content { font-size: 14px; color: #e8d5c4; line-height: 1.6; }
        .card-hint { position: absolute; bottom: 16px; right: 16px; font-size: 11px; color: #8b6f47; font-style: italic; }

        /* Navigation */
        .navigation {
            display: flex; gap: 12px; justify-content: center; align-items: center; margin-top: 24px;
        }
        .nav-btn {
            padding: 10px 24px; background: rgba(139,111,71,0.3); border: 1px solid #8b6f47;
            color: #d4af9a; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500;
            transition: all 0.2s;
        }
        .nav-btn:hover:not(:disabled) { background: rgba(139,111,71,0.5); border-color: #d4af9a; }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .counter { padding: 10px 24px; color: #b89968; font-size: 14px; font-weight: 500; min-width: 100px; text-align: center; }

        /* Mode content */
        .mode-content { display: none; }
        .mode-content.active { display: block; }

        /* Quiz */
        .quiz-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px;
        }
        .quiz-score-display {
            font-size: 22px; font-weight: 600; color: #d4af9a;
        }
        .quiz-progress-label {
            font-size: 14px; color: #b89968; font-weight: 500;
        }
        .quiz-restart-btn {
            padding: 8px 16px; background: rgba(139,111,71,0.2);
            border: 1px solid #8b6f47; color: #d4af9a; border-radius: 6px;
            cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s;
        }
        .quiz-restart-btn:hover { background: rgba(139,111,71,0.4); border-color: #d4af9a; }

        .quiz-question {
            background: linear-gradient(135deg, #4a3728 0%, #3d2f23 100%);
            border: 2px solid #8b6f47; border-radius: 12px; padding: 40px; margin-bottom: 32px;
        }
        .question-label { font-size: 11px; letter-spacing: 1.5px; color: #d4af9a; text-transform: uppercase; margin-bottom: 12px; }
        .question-text { font-size: 16px; color: #e8d5c4; line-height: 1.8; margin-bottom: 24px; font-style: italic; }
        .options { display: grid; gap: 12px; }
        .option-btn {
            padding: 16px; background: rgba(139,111,71,0.2); border: 2px solid #8b6f47;
            color: #d4af9a; border-radius: 8px; cursor: pointer; font-size: 14px;
            font-weight: 500; text-align: left; transition: all 0.2s;
        }
        .option-btn:hover:not(:disabled) { background: rgba(139,111,71,0.4); border-color: #d4af9a; }
        .option-btn:disabled { cursor: not-allowed; }
        .option-btn.correct { background: rgba(76,120,80,0.3); border-color: #4c7850; color: #7cb77f; }
        .option-btn.incorrect { background: rgba(160,70,70,0.3); border-color: #a04646; color: #d97070; }
        .quiz-feedback {
            margin-top: 16px; padding: 12px 16px; border-radius: 8px;
            font-size: 14px; text-align: center;
        }
        .quiz-feedback.correct { background: rgba(76,120,80,0.2); color: #7cb77f; }
        .quiz-feedback.incorrect { background: rgba(160,70,70,0.2); color: #d97070; }

        /* Quiz completion */
        .quiz-complete {
            background: linear-gradient(135deg, #4a3728 0%, #3d2f23 100%);
            border: 2px solid #8b6f47; border-radius: 12px; padding: 40px;
            text-align: center; margin-bottom: 32px;
        }
        .quiz-complete-title { font-size: 28px; font-weight: 600; color: #d4af9a; margin-bottom: 8px; }
        .quiz-complete-score { font-size: 56px; font-weight: 700; color: #d4af9a; margin: 20px 0 8px; }
        .quiz-complete-label { font-size: 14px; color: #b89968; margin-bottom: 28px; }
        .quiz-complete-grade { font-size: 20px; font-weight: 600; margin-bottom: 32px; }
        .review-toggle {
            padding: 10px 20px; background: rgba(139,111,71,0.2); border: 1px solid #8b6f47;
            color: #d4af9a; border-radius: 6px; cursor: pointer; font-size: 14px;
            transition: all 0.2s; margin-right: 12px;
        }
        .review-toggle:hover { background: rgba(139,111,71,0.4); }
        .review-list { margin-top: 28px; text-align: left; }
        .review-item {
            display: flex; align-items: flex-start; gap: 12px; padding: 12px;
            border-radius: 8px; margin-bottom: 8px; font-size: 13px;
            background: rgba(139,111,71,0.08);
        }
        .review-item.correct-item { border-left: 3px solid #4c7850; }
        .review-item.incorrect-item { border-left: 3px solid #a04646; }
        .review-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
        .review-wine { color: #e8d5c4; font-weight: 600; margin-bottom: 3px; }
        .review-answer { color: #8b6f47; font-size: 12px; }
        .review-answer.wrong { color: #d97070; }

        /* Scoreboard */
        .scoreboard {
            background: linear-gradient(135deg, #4a3728 0%, #3d2f23 100%);
            border: 2px solid #8b6f47; border-radius: 12px; padding: 24px; margin-top: 40px;
        }
        .scoreboard-title { font-size: 16px; font-weight: 600; color: #d4af9a; margin-bottom: 16px; text-align: center; letter-spacing: 1px; }
        .scoreboard-list { display: flex; flex-direction: column; gap: 8px; }
        .scoreboard-row {
            display: grid; grid-template-columns: 40px 1fr 80px; gap: 16px;
            padding: 12px; background: rgba(139,111,71,0.1); border-radius: 8px; align-items: center;
        }
        .scoreboard-rank { font-weight: 600; color: #d4af9a; font-size: 14px; text-align: center; }
        .scoreboard-name { color: #e8d5c4; font-size: 14px; }
        .scoreboard-score { color: #d4af9a; font-weight: 600; text-align: right; font-size: 14px; }

        .empty-state { text-align: center; padding: 60px 20px; color: #8b6f47; }
        .empty-state p { font-size: 16px; }
    </style>
</head>

    <!-- QUIZ MODE -->
    <div id="quizMode" class="mode-content">
        <div class="quiz-header">

            <div class="quiz-progress-label">Question <span id="quizCurrent">1</span> / <span id="quizMax">15</span></div>
            <button class="quiz-restart-btn" onclick="restartQuiz()">↺ Restart</button>
        </div>
        <div id="quizArea"></div>
        <div class="navigation" id="quizNav">
            <button class="nav-btn" id="quizPrevBtn" onclick="previousQuiz()">← Previous</button>
            <button class="nav-btn" id="quizNextBtn" onclick="nextQuiz()">Next →</button>
        </div>
        <div class="scoreboard">
            <div class="scoreboard-title">Leaderboard</div>
            <div class="scoreboard-list" id="scoreboardList"></div>
        </div>
    </div>
</div>

let currentIndex = 0;
let filteredWines = winesData.filter(w => w.category !== 'By Glass');
let isFlipped = false;
let currentMode = 'flashcard';
let quizIndex = 0;
let quizScore = 0;
let quizWines = [];
let answered = {};
let currentProfile = 'Guest';
let showReview = false;
let currentStreak = 0;
let longestStreak = 0;

const allProfiles = ['Guest','Jocelyn','TayTay','Jake','Em','Viny','Two Hummus Drew','Damian','Luke','Josh','Gracyn','Bailey','Lea'];
const allCategories = ['All','All Red','Red Wine','Captain\'s List','White Wine','Sparkling'];
let activeCategory = 'All';

// ─── KEYBOARD NAVIGATION ────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
    if (currentMode === 'flashcard') {
        if (e.key === 'ArrowRight') nextCard();
        else if (e.key === 'ArrowLeft') previousCard();
        else if (e.key === ' ') { e.preventDefault(); flipCard(); }
    } else if (currentMode === 'quiz') {
        if (e.key === 'ArrowRight') nextQuiz();
        else if (e.key === 'ArrowLeft') previousQuiz();
    }
});

// ─── MODE SWITCH ────────────────────────────────────────────────────────────
function switchMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-tab').forEach(btn => {
        btn.classList.toggle('active', btn.textContent === (mode === 'flashcard' ? 'Flashcards' : 'Quiz'));
    });
    document.querySelectorAll('.mode-content').forEach(el => el.classList.remove('active'));
    if (mode === 'flashcard') {
        document.getElementById('flashcardMode').classList.add('active');
    } else {
        document.getElementById('quizMode').classList.add('active');
        renderScoreboard();
        if (quizWines.length === 0) initQuiz();
        renderQuiz();
    }
}

// ─── QUIZ ────────────────────────────────────────────────────────────────────
function initQuiz() {
    let pool = [...filteredWines].filter(w => w.tasting_notes);
    quizWines = pool.sort(() => Math.random() - 0.5).slice(0, 15);
    quizIndex = 0; quizScore = 0; answered = {}; showReview = false;
    currentStreak = 0; longestStreak = 0;
    document.getElementById('quizMax').textContent = quizWines.length;
    updateQuizCounter();
    renderScoreboard();
}

function restartQuiz() {
    quizWines = [];
    initQuiz();
    renderQuiz();
}

function renderQuiz() {
    const quizArea = document.getElementById('quizArea');
    const quizNav = document.getElementById('quizNav');

    // All answered → show completion
    const allDone = quizWines.length > 0 && Object.keys(answered).length === quizWines.length;

    if (allDone && quizIndex === quizWines.length) {
        quizNav.style.display = 'none';
        renderQuizComplete(quizArea);
        return;
    }
    quizNav.style.display = 'flex';

    if (!quizWines[quizIndex]) {
        quizArea.innerHTML = '<div class="empty-state"><p>No wines available for quiz in this category.</p></div>';
        return;
    }

    const wine = quizWines[quizIndex];
    const options = getQuizOptions(wine);
    const isAnswered = answered[quizIndex] !== undefined;
    const isCorrect = answered[quizIndex] === wine.id;

    quizArea.innerHTML = `
        <div class="quiz-question">
            <div class="question-label">Identify this wine</div>
            <div class="question-text">${wine.tasting_notes}</div>
            <div class="options">
                ${options.map(opt => `
                    <button class="option-btn ${isAnswered ? (opt.id === wine.id ? 'correct' : answered[quizIndex] === opt.id ? 'incorrect' : '') : ''}"
                            onclick="answerQuiz(${opt.id})"
                            ${isAnswered ? 'disabled' : ''}>
                        ${opt.name}
                    </button>
                `).join('')}
            </div>
            ${isAnswered ? `
                <div class="quiz-feedback ${isCorrect ? 'correct' : 'incorrect'}">
                    ${isCorrect ? '✓ Correct!' : `✗ The answer was <strong>${wine.name}</strong> by ${wine.producer}`}
                </div>
            ` : ''}
        </div>
    `;
}

function renderQuizComplete(container) {
    const pct = Math.round((quizScore / quizWines.length) * 100);
    let grade, gradeColor;
    if (longestStreak >= 10) { grade = '🏆 On Fire!'; gradeColor = '#d4af9a'; }
    else if (longestStreak >= 7) { grade = '🥂 Solid Run!'; gradeColor = '#7cb77f'; }
    else if (longestStreak >= 4) { grade = '📚 Getting There'; gradeColor = '#d4af9a'; }
    else { grade = '🍇 Keep Practicing'; gradeColor = '#d97070'; }

    const reviewHTML = showReview ? `
        <div class="review-list">
            ${quizWines.map((wine, i) => {
                const correct = answered[i] === wine.id;
                const userWine = winesData.find(w => w.id === answered[i]);
                return `
                    <div class="review-item ${correct ? 'correct-item' : 'incorrect-item'}">
                        <div class="review-icon">${correct ? '✓' : '✗'}</div>
                        <div>
                            <div class="review-wine">${wine.name}</div>
                            ${!correct ? `<div class="review-answer wrong">You chose: ${userWine ? userWine.name : 'No answer'}</div>` : ''}
                            <div class="review-answer" style="color:#6b5040;font-size:11px;margin-top:4px;">${wine.tasting_notes.substring(0, 80)}…</div>
                        </div>
                    </div>
                `;
            }).join('')}
        </div>
    ` : '';

    container.innerHTML = `
        <div class="quiz-complete">
            <div class="quiz-complete-title">Quiz Complete!</div>
            <div class="quiz-complete-score">🔥 ${longestStreak}</div>
            <div class="quiz-complete-label">best streak &nbsp;·&nbsp; ${quizScore}/${quizWines.length} correct (${pct}%)</div>
            <div class="quiz-complete-grade" style="color:${gradeColor}">${grade}</div>
            <button class="review-toggle" onclick="toggleReview()">${showReview ? 'Hide' : 'Review Answers'}</button>
            <button class="quiz-restart-btn" onclick="restartQuiz()">↺ New Quiz</button>
            ${reviewHTML}
        </div>
    `;
}

function toggleReview() {
    showReview = !showReview;
    const quizArea = document.getElementById('quizArea');
    renderQuizComplete(quizArea);
}

function getQuizOptions(wine) {
    const correct = { id: wine.id, name: wine.name };
    const others = filteredWines
        .filter(w => w.id !== wine.id && w.tasting_notes)
        .sort(() => Math.random() - 0.5).slice(0, 3)
        .map(w => ({ id: w.id, name: w.name }));
    return [correct, ...others].sort(() => Math.random() - 0.5);
}

function answerQuiz(wineId) {
    const wine = quizWines[quizIndex];
    if (answered[quizIndex] !== undefined) return;
    answered[quizIndex] = wineId;
    if (wineId === wine.id) {
        quizScore++;
        currentStreak++;
        if (currentStreak > longestStreak) longestStreak = currentStreak;
    } else {
        currentStreak = 0;
    }
    document.getElementById('quizStreak').textContent = currentStreak;

    const allDone = Object.keys(answered).length === quizWines.length;
    if (allDone) {
        saveScore(currentProfile, longestStreak);
        renderScoreboard();
    }
    renderQuiz();
}

function nextQuiz() {
    if (quizIndex < quizWines.length - 1) { quizIndex++; updateQuizCounter(); renderQuiz(); }
    else if (Object.keys(answered).length === quizWines.length) {
        quizIndex = quizWines.length;
        document.getElementById('quizNav').style.display = 'none';
        renderQuizComplete(document.getElementById('quizArea'));
    }
}

function previousQuiz() {
    if (quizIndex > 0) { quizIndex--; updateQuizCounter(); renderQuiz(); }
}

function updateQuizCounter() {
    document.getElementById('quizCurrent').textContent = quizIndex + 1;
    document.getElementById('quizPrevBtn').disabled = quizIndex === 0;
    document.getElementById('quizNextBtn').disabled = false;
}

// ─── PROFILE / SCORES ────────────────────────────────────────────────────────
function changeProfile() {
    currentProfile = document.getElementById('profileSelect').value;
    localStorage.setItem('wineTrainingProfile', currentProfile);
}
function loadProfile() {
    const saved = localStorage.getItem('wineTrainingProfile');
    if (saved && allProfiles.includes(saved)) currentProfile = saved;
    document.getElementById('profileSelect').value = currentProfile;
}
function getProfileScore(profile) {
    const key = `wineScores_${activeCategory}`;
    return JSON.parse(localStorage.getItem(key) || '{}')[profile] || 0;
}
function saveScore(profile, streak) {
    const key = `wineScores_${activeCategory}`;
    const scores = JSON.parse(localStorage.getItem(key) || '{}');
    if (!scores[profile] || streak > scores[profile]) {
        scores[profile] = streak;
        localStorage.setItem(key, JSON.stringify(scores));
    }
}
function renderScoreboard() {
    const list = document.getElementById('scoreboardList');
    const title = document.querySelector('.scoreboard-title');
    title.textContent = `${activeCategory} — Best Streak`;
    const rankings = allProfiles
        .filter(n => n !== 'Guest')
        .map(n => ({ name: n, score: getProfileScore(n) }))
        .sort((a, b) => b.score - a.score);
    list.innerHTML = rankings.map((e, i) => `
        <div class="scoreboard-row">
            <div class="scoreboard-rank">#${i + 1}</div>
            <div class="scoreboard-name">${e.name}</div>
            <div class="scoreboard-score">${e.score > 0 ? '🔥 ' + e.score : '—'}</div>
        </div>
    `).join('');
}

// ─── FILTERS ─────────────────────────────────────────────────────────────────
function renderFilters() {
    const fg = document.getElementById('filterGroup');
    allCategories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn' + (cat === 'All' ? ' active' : '');
        btn.textContent = cat;
        btn.onclick = () => filterByCategory(cat);
        fg.appendChild(btn);
    });
}

function filterByCategory(category) {
    activeCategory = category;
    if (category === 'All') {
        filteredWines = winesData.filter(w => w.category !== 'By Glass');
    } else if (category === 'All Red') {
        filteredWines = winesData.filter(w => w.category === 'Red Wine' || w.category === "Captain's List");
    } else {
        filteredWines = winesData.filter(w => w.category === category);
    }
    currentIndex = 0; isFlipped = false; quizWines = [];
    renderCard(); updateProgress(); updateFilterButtons(category);
    if (currentMode === 'quiz') renderScoreboard();
}

function updateFilterButtons(active) {
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent === active);
    });
}

// ─── FLASHCARDS ──────────────────────────────────────────────────────────────
function renderCard() {
    const cardArea = document.getElementById('cardArea');
    const wine = filteredWines[currentIndex];
    if (!wine) { cardArea.innerHTML = '<div class="empty-state"><p>No wines in this category</p></div>'; return; }

    cardArea.innerHTML = `
        <div class="card-container">
            <div class="card ${isFlipped ? 'flipped' : ''}" onclick="flipCard()">
                <div class="card-face card-front">
                    <div class="card-category">${wine.category}</div>
                    <div class="card-title">${wine.name}</div>
                    <div class="card-producer">${wine.producer}</div>
                    <div class="card-meta">
                        <div class="meta-item"><div class="meta-label">Country</div><div class="meta-value">${wine.country}</div></div>
                        <div class="meta-item"><div class="meta-label">Grape</div><div class="meta-value">${wine.grape}</div></div>
                        <div class="meta-item"><div class="meta-label">Price</div><div class="meta-value">$${wine.price}</div></div>
                    </div>
                    <div class="card-hint">Click or press Space to see tasting notes →</div>
                </div>
                <div class="card-face card-back">
                    ${wine.body ? `<div class="card-section"><div class="section-label">Body & Acidity</div><div class="section-content">${wine.body} body · ${wine.acidity} acidity</div></div>` : ''}
                    ${wine.tasting_notes ? `<div class="card-section"><div class="section-label">Tasting Notes</div><div class="section-content">${wine.tasting_notes}</div></div>` : ''}
                    ${wine.food_pairings ? `<div class="card-section"><div class="section-label">Food Pairings</div><div class="section-content">${wine.food_pairings}</div></div>` : ''}
                    ${!wine.body && !wine.tasting_notes ? '<div class="section-content" style="color:#8b6f47;font-style:italic;">More details coming soon</div>' : ''}
                    <div class="card-hint" style="top:auto;bottom:16px;">← Click to flip back</div>
                </div>
            </div>
        </div>
    `;
}

function flipCard() { isFlipped = !isFlipped; renderCard(); }
function nextCard() { if (currentIndex < filteredWines.length - 1) { currentIndex++; isFlipped = false; renderCard(); updateProgress(); } }
function previousCard() { if (currentIndex > 0) { currentIndex--; isFlipped = false; renderCard(); updateProgress(); } }

function updateProgress() {
    const total = filteredWines.length;
    document.getElementById('progressFill').style.width = ((currentIndex + 1) / total * 100) + '%';
    document.getElementById('currentCard').textContent = currentIndex + 1;
    document.getElementById('totalCards').textContent = total;
    document.getElementById('prevBtn').disabled = currentIndex === 0;
    document.getElementById('nextBtn').disabled = currentIndex === total - 1;
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
function init() { loadProfile(); renderFilters(); renderCard(); updateProgress(); }
init();
</script>
</body>
</html>
