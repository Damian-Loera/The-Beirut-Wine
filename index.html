<html lang="en">

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #2c1810 0%, #1a0f0a 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 20px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .profile-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .profile-select {
            padding: 8px 12px;
            background: rgba(139, 111, 71, 0.3);
            border: 1px solid #8b6f47;
            color: #d4af9a;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .profile-select:hover {
            background: rgba(139, 111, 71, 0.5);
        }

        .profile-select option {
            background: #3d2f23;
            color: #d4af9a;
        }

        .scoreboard {
            background: linear-gradient(135deg, #4a3728 0%, #3d2f23 100%);
            border: 2px solid #8b6f47;
            border-radius: 12px;
            padding: 24px;
            margin-top: 40px;
        }

        .scoreboard-title {
            font-size: 16px;
            font-weight: 600;
            color: #d4af9a;
            margin-bottom: 16px;
            text-align: center;
            letter-spacing: 1px;
        }

        .scoreboard-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .scoreboard-row {
            display: grid;
            grid-template-columns: 40px 1fr 80px;
            gap: 16px;
            padding: 12px;
            background: rgba(139, 111, 71, 0.1);
            border-radius: 8px;
            align-items: center;
        }

        .scoreboard-rank {
            font-weight: 600;
            color: #d4af9a;
            font-size: 14px;
            text-align: center;
        }

        .scoreboard-name {
            color: #e8d5c4;
            font-size: 14px;
        }

        .scoreboard-score {
            color: #d4af9a;
            font-weight: 600;
            text-align: right;
            font-size: 14px;
        }

        .header p {
            font-size: 14px;
            color: #d4af9a;
            font-weight: 500;
        }

        .mode-tabs {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(139, 111, 71, 0.3);
            padding-bottom: 16px;
        }

        .mode-tab {
            padding: 10px 20px;
            background: transparent;
            border: none;
            color: #8b6f47;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .mode-tab.active {
            color: #d4af9a;
            border-bottom-color: #d4af9a;
        }

        .mode-tab:hover {
            color: #d4af9a;
        }

        .quiz-question {
            background: linear-gradient(135deg, #4a3728 0%, #3d2f23 100%);
            border: 2px solid #8b6f47;
            border-radius: 12px;
            padding: 40px;
            margin-bottom: 32px;
        }

        .question-label {
            font-size: 11px;
            letter-spacing: 1.5px;
            color: #d4af9a;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .question-text {
            font-size: 16px;
            color: #e8d5c4;
            line-height: 1.8;
            margin-bottom: 24px;
            font-style: italic;
        }

        .options {
            display: grid;
            gap: 12px;
        }

        .option-btn {
            padding: 16px;
            background: rgba(139, 111, 71, 0.2);
            border: 2px solid #8b6f47;
            color: #d4af9a;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            text-align: left;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(139, 111, 71, 0.4);
            border-color: #d4af9a;
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .option-btn.correct {
            background: rgba(76, 120, 80, 0.3);
            border-color: #4c7850;
            color: #7cb77f;
        }

        .option-btn.incorrect {
            background: rgba(160, 70, 70, 0.3);
            border-color: #a04646;
            color: #d97070;
        }

        .quiz-feedback {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
        }

        .quiz-feedback.correct {
            background: rgba(76, 120, 80, 0.2);
            color: #7cb77f;
        }

        .quiz-feedback.incorrect {
            background: rgba(160, 70, 70, 0.2);
            color: #d97070;
        }

        .quiz-score {
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            color: #d4af9a;
            margin-bottom: 32px;
        }

        .mode-content {
            display: none;
        }

        .mode-content.active {
            display: block;
        }

        .controls {
            display: grid;
            gap: 16px;
            margin-bottom: 32px;
        }

        .filter-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #8b6f47;
            background: rgba(139, 111, 71, 0.2);
            color: #d4af9a;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            background: rgba(139, 111, 71, 0.4);
            border-color: #d4af9a;
        }

        .filter-btn.active {
            background: #8b6f47;
            border-color: #d4af9a;
            color: #fff;
        }

        .progress-bar {
            height: 3px;
            background: rgba(212, 175, 154, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #d4af9a 0%, #c9956f 100%);
            transition: width 0.3s ease;
        }

        .card-container {
            perspective: 1000px;
            margin-bottom: 32px;
        }

        .card {
            width: 100%;
            height: 360px;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px;
            border-radius: 12px;
            border: 2px solid #8b6f47;
        }

        .card-front {
            background: linear-gradient(135deg, #4a3728 0%, #3d2f23 100%);
        }

        .card-back {
            background: linear-gradient(135deg, #3d2f23 0%, #2c1810 100%);
            transform: rotateY(180deg);
        }

        .card-category {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: #d4af9a;
            text-transform: uppercase;
            margin-bottom: 12px;
            opacity: 0.8;
        }

        .card-title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .card-producer {
            font-size: 16px;
            color: #b89968;
            margin-bottom: 16px;
            font-weight: 500;
        }

        .card-meta {
            display: flex;
            gap: 24px;
            margin-top: 24px;
            font-size: 13px;
            color: #b89968;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
        }

        .meta-label {
            font-size: 11px;
            letter-spacing: 0.5px;
            color: #8b6f47;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .meta-value {
            font-weight: 600;
            color: #d4af9a;
            font-size: 14px;
        }

        .card-section {
            margin-bottom: 16px;
        }

        .section-label {
            font-size: 11px;
            letter-spacing: 1px;
            color: #8b6f47;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .section-content {
            font-size: 14px;
            color: #e8d5c4;
            line-height: 1.6;
        }

        .card-hint {
            position: absolute;
            bottom: 16px;
            right: 16px;
            font-size: 11px;
            color: #8b6f47;
            font-style: italic;
        }

        .navigation {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            margin-top: 24px;
        }

        .nav-btn {
            padding: 10px 24px;
            background: rgba(139, 111, 71, 0.3);
            border: 1px solid #8b6f47;
            color: #d4af9a;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .nav-btn:hover:not(:disabled) {
            background: rgba(139, 111, 71, 0.5);
            border-color: #d4af9a;
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .counter {
            padding: 10px 24px;
            color: #b89968;
            font-size: 14px;
            font-weight: 500;
            min-width: 100px;
            text-align: center;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #8b6f47;
        }

        .empty-state p {
            font-size: 16px;
        }
    </style>
</head>

                <div class="counter">

                </div>
                <button class="nav-btn" id="nextBtn" onclick="nextCard()">Next →</button>
            </div>
        </div>

        <div id="quizMode" class="mode-content">
            <div class="quiz-score">
                Score: <span id="quizScore">0</span> / 15
            </div>
            <div id="quizArea"></div>

            <div class="navigation">
                <button class="nav-btn" id="quizPrevBtn" onclick="previousQuiz()">← Previous</button>
                <button class="nav-btn" id="quizNextBtn" onclick="nextQuiz()">Next →</button>
            </div>

            <div class="scoreboard">
                <div class="scoreboard-title">Leaderboard</div>
                <div class="scoreboard-list" id="scoreboardList"></div>
            </div>
        </div>
    </div>

        ];

        let currentIndex = 0;
        let filteredWines = winesData.filter(w => w.category !== 'By Glass');
        let isFlipped = false;
        let currentMode = 'flashcard';
        let quizIndex = 0;
        let quizScore = 0;
        let quizWines = [];
        let answered = {};
        let currentProfile = 'Guest';
        
        const allProfiles = ['Guest', 'Jocelyn', 'TayTay', 'Jake', 'Em', 'Viny', 'Two Hummus Drew', 'Damian', 'Luke', 'Josh', 'Gracyn', 'Bailey', 'Lea'];
        const allCategories = ['All', 'All Red', 'Red Wine', 'Captain\'s List', 'White Wine', 'Sparkling'];
        const categories = allCategories;

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-tab').forEach(btn => {
                btn.classList.toggle('active', btn.textContent === (mode === 'flashcard' ? 'Flashcards' : 'Quiz'));
            });
            document.querySelectorAll('.mode-content').forEach(el => {
                el.classList.remove('active');
            });
            if (mode === 'flashcard') {
                document.getElementById('flashcardMode').classList.add('active');
            } else {
                document.getElementById('quizMode').classList.add('active');
                renderScoreboard();
                if (quizWines.length === 0) {
                    initQuiz();
                }
                renderQuiz();
            }
        }

        function initQuiz() {
            let availableWines = [...filteredWines].filter(w => w.tasting_notes);
            quizWines = availableWines.sort(() => Math.random() - 0.5).slice(0, 15);
            quizIndex = 0;
            quizScore = 0;
            answered = {};
            updateQuizCounter();
            renderScoreboard();
        }

        function renderQuiz() {
            const quizArea = document.getElementById('quizArea');
            if (!quizWines[quizIndex]) {
                quizArea.innerHTML = '<div class="empty-state"><p>Quiz complete! Review your results or try again.</p></div>';
                return;
            }

            const wine = quizWines[quizIndex];
            const options = getQuizOptions(wine);
            const isAnswered = answered[quizIndex] !== undefined;
            const isCorrect = answered[quizIndex] === wine.id;

            quizArea.innerHTML = `
                <div class="quiz-question">
                    <div class="question-label">Identify this wine</div>
                    <div class="question-text">${wine.tasting_notes || 'A mysterious wine...'}</div>
                    <div class="options">
                        ${options.map((opt, idx) => `
                            <button class="option-btn ${isAnswered ? (opt.id === wine.id ? 'correct' : answered[quizIndex] === opt.id ? 'incorrect' : '') : ''}" 
                                    onclick="answerQuiz(${opt.id})" 
                                    ${isAnswered ? 'disabled' : ''}>
                                ${opt.name}
                            </button>
                        `).join('')}
                    </div>
                    ${isAnswered ? `
                        <div class="quiz-feedback ${isCorrect ? 'correct' : 'incorrect'}">
                            ${isCorrect ? '✓ Correct!' : `✗ Incorrect. It was ${wine.name} by ${wine.producer}`}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function getQuizOptions(wine) {
            const correct = { id: wine.id, name: wine.name };
            const others = filteredWines
                .filter(w => w.id !== wine.id && w.tasting_notes)
                .sort(() => Math.random() - 0.5)
                .slice(0, 3)
                .map(w => ({ id: w.id, name: w.name }));
            
            return [correct, ...others].sort(() => Math.random() - 0.5);
        }

        function answerQuiz(wineId) {
            const wine = quizWines[quizIndex];
            answered[quizIndex] = wineId;
            if (wineId === wine.id) {
                quizScore++;
            }
            document.getElementById('quizScore').textContent = quizScore;
            
            // Check if quiz is complete and save score
            if (quizIndex === quizWines.length - 1) {
                saveScore(currentProfile, quizScore);
                renderScoreboard();
            }
            
            renderQuiz();
        }

        function nextQuiz() {
            if (quizIndex < quizWines.length - 1) {
                quizIndex++;
                updateQuizCounter();
                renderQuiz();
            }
        }

        function previousQuiz() {
            if (quizIndex > 0) {
                quizIndex--;
                updateQuizCounter();
                renderQuiz();
            }
        }

        function updateQuizCounter() {
            document.getElementById('quizPrevBtn').disabled = quizIndex === 0;
            document.getElementById('quizNextBtn').disabled = quizIndex === quizWines.length - 1;
        }

        function changeProfile() {
            currentProfile = document.getElementById('profileSelect').value;
            localStorage.setItem('wineTrainingProfile', currentProfile);
        }

        function loadProfile() {
            const saved = localStorage.getItem('wineTrainingProfile');
            if (saved && allProfiles.includes(saved)) {
                currentProfile = saved;
            }
            document.getElementById('profileSelect').value = currentProfile;
        }

        function getProfileScore(profile) {
            const scores = JSON.parse(localStorage.getItem('wineScores') || '{}');
            return scores[profile] || 0;
        }

        function saveScore(profile, score) {
            const scores = JSON.parse(localStorage.getItem('wineScores') || '{}');
            if (!scores[profile] || score > scores[profile]) {
                scores[profile] = score;
                localStorage.setItem('wineScores', JSON.stringify(scores));
            }
        }

        function renderScoreboard() {
            const scoreboardList = document.getElementById('scoreboardList');
            const rankings = allProfiles
                .filter(name => name !== 'Guest')
                .map(name => ({ name, score: getProfileScore(name) }))
                .sort((a, b) => b.score - a.score);

            scoreboardList.innerHTML = rankings
                .map((entry, idx) => `
                    <div class="scoreboard-row">
                        <div class="scoreboard-rank">#${idx + 1}</div>
                        <div class="scoreboard-name">${entry.name}</div>
                        <div class="scoreboard-score">${entry.score}/15</div>
                    </div>
                `).join('');
        }

        function init() {
            loadProfile();
            renderFilters();
            renderCard();
            updateProgress();
        }

        function renderFilters() {
            const filterGroup = document.getElementById('filterGroup');
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn' + (cat === 'All' ? ' active' : '');
                btn.textContent = cat;
                btn.onclick = () => filterByCategory(cat);
                filterGroup.appendChild(btn);
            });
        }

        function filterByCategory(category) {
            if (category === 'All') {
                filteredWines = winesData.filter(w => w.category !== 'By Glass');
            } else if (category === 'All Red') {
                filteredWines = winesData.filter(w => (w.category === 'Red Wine' || w.category === 'Captain\'s List') && w.category !== 'By Glass');
            } else {
                filteredWines = winesData.filter(w => w.category === category && w.category !== 'By Glass');
            }
            currentIndex = 0;
            isFlipped = false;
            quizWines = [];
            renderCard();
            updateProgress();
            updateFilterButtons(category);
        }

        function updateFilterButtons(active) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent === active);
            });
        }

        function renderCard() {
            const cardArea = document.getElementById('cardArea');
            const wine = filteredWines[currentIndex];

            if (!wine) {
                cardArea.innerHTML = '<div class="empty-state"><p>No wines in this category</p></div>';
                return;
            }

            cardArea.innerHTML = `
                <div class="card-container">
                    <div class="card ${isFlipped ? 'flipped' : ''}" onclick="flipCard()">
                        <div class="card-face card-front">
                            <div class="card-category">${wine.category}</div>
                            <div class="card-title">${wine.name}</div>
                            <div class="card-producer">${wine.producer}</div>
                            <div class="card-meta">
                                <div class="meta-item">
                                    <div class="meta-label">Country</div>
                                    <div class="meta-value">${wine.country}</div>
                                </div>
                                <div class="meta-item">
                                    <div class="meta-label">Grape</div>
                                    <div class="meta-value">${wine.grape}</div>
                                </div>
                                <div class="meta-item">
                                    <div class="meta-label">Price</div>
                                    <div class="meta-value">$${wine.price}</div>
                                </div>
                            </div>
                            <div class="card-hint">Click to see tasting notes →</div>
                        </div>
                        <div class="card-face card-back">
                            ${wine.body ? `<div class="card-section">
                                <div class="section-label">Body & Acidity</div>
                                <div class="section-content">${wine.body} body • ${wine.acidity} acidity</div>
                            </div>` : ''}
                            ${wine.tasting_notes ? `<div class="card-section">
                                <div class="section-label">Tasting Notes</div>
                                <div class="section-content">${wine.tasting_notes}</div>
                            </div>` : ''}
                            ${wine.food_pairings ? `<div class="card-section">
                                <div class="section-label">Food Pairings</div>
                                <div class="section-content">${wine.food_pairings}</div>
                            </div>` : ''}
                            ${!wine.body && !wine.tasting_notes && !wine.food_pairings ? '<div class="section-content" style="color: #8b6f47; font-style: italic;">More details coming soon</div>' : ''}
                            <div class="card-hint" style="top: auto; bottom: 16px;">← Click to flip back</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function flipCard() {
            isFlipped = !isFlipped;
            renderCard();
        }

        function nextCard() {
            if (currentIndex < filteredWines.length - 1) {
                currentIndex++;
                isFlipped = false;
                renderCard();
                updateProgress();
            }
        }

        function previousCard() {
            if (currentIndex > 0) {
                currentIndex--;
                isFlipped = false;
                renderCard();
                updateProgress();
            }
        }

        function updateProgress() {
            const total = filteredWines.length;
            const progress = ((currentIndex + 1) / total) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('currentCard').textContent = currentIndex + 1;
            document.getElementById('totalCards').textContent = total;
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === total - 1;
        }

        init();
    </script>
</body>
